name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 类型检查 + 排盘回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 仓库已提交 package-lock.json：按锁定版本安装，并开 npm 缓存
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      - name: 排盘引擎和本地缓存回归
        run: npm test

      - name: Next.js 生产构建
        run: npm run build

      - name: 生产依赖高危安全审计（报告，不阻断演示分支）
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
